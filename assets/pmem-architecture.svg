<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
  <title id="title">PMEM architecture</title>
  <desc id="description">Coding agents query one PMEM memory runtime. Markdown cards, a SQLite and FTS runtime, and optional local semantic retrieval form a ContextPack returned to the agent.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#08111f"/>
      <stop offset="1" stop-color="#11233f"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="context" x1="0" x2="1">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #93c5fd; font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; font-size: 31px; font-weight: 700; }
      .copy { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #cbd5e1; font-size: 18px; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #a5b4fc; font-size: 16px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1440" height="920" rx="32" fill="url(#canvas)"/>
  <circle cx="88" cy="80" r="210" fill="#1d4ed8" opacity=".16"/>
  <circle cx="1370" cy="850" r="270" fill="#7c3aed" opacity=".13"/>
  <text x="720" y="68" text-anchor="middle" class="eyebrow">ONE MEMORY CORE · THREE INTERFACES</text>
  <text x="720" y="113" text-anchor="middle" class="title">PMEM turns project state into reliable agent context</text>

  <g filter="url(#shadow)">
    <rect x="540" y="158" width="360" height="104" rx="20" fill="#10213a" stroke="#2b4d73" stroke-width="2"/>
    <circle cx="590" cy="210" r="23" fill="#38bdf8" opacity=".94"/>
    <path d="M581 210h18M590 201v18" stroke="#082f49" stroke-width="4" stroke-linecap="round"/>
    <text x="632" y="202" class="title" font-size="25">Coding agent</text>
    <text x="632" y="230" class="copy">Claude · Codex · Cursor · MCP clients</text>
  </g>

  <path d="M720 266v61" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="332" width="660" height="170" rx="26" fill="url(#runtime)"/>
    <circle cx="456" cy="417" r="33" fill="#f8fafc" opacity=".94"/>
    <path d="M442 425l13-28 13 28h-9l-4 10-4-10z" fill="#4f46e5"/>
    <text x="518" y="402" class="title" font-size="34">PMEM Memory Runtime</text>
    <text x="518" y="433" class="copy" fill="#eef2ff">Structured retrieval, lifecycle policy, provenance, and recovery</text>
    <g transform="translate(518 455)">
      <rect width="112" height="28" rx="14" fill="#ffffff" opacity=".2"/>
      <text x="56" y="20" text-anchor="middle" class="small" fill="#ffffff">CLI</text>
      <rect x="124" width="112" height="28" rx="14" fill="#ffffff" opacity=".2"/>
      <text x="180" y="20" text-anchor="middle" class="small" fill="#ffffff">MCP</text>
      <rect x="248" width="112" height="28" rx="14" fill="#ffffff" opacity=".2"/>
      <text x="304" y="20" text-anchor="middle" class="small" fill="#ffffff">SDK</text>
    </g>
  </g>

  <path d="M512 506v55M720 506v55M928 506v55" stroke="#7dd3fc" stroke-width="3"/>
  <path d="M512 561h416" stroke="#7dd3fc" stroke-width="3"/>
  <path d="M512 561v28M720 561v28M928 561v28" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="116" y="595" width="352" height="151" rx="20" fill="#10213a" stroke="#31547d" stroke-width="2"/>
    <text x="152" y="637" class="eyebrow">INSPECTABLE MEMORY</text>
    <text x="152" y="681" class="title" font-size="26">Markdown cards + Git</text>
    <text x="152" y="714" class="copy">Decisions, tasks, traces,</text>
    <text x="152" y="739" class="copy">and project state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="544" y="595" width="352" height="151" rx="20" fill="#10213a" stroke="#31547d" stroke-width="2"/>
    <text x="580" y="637" class="eyebrow">FAST, REBUILDABLE INDEX</text>
    <text x="580" y="681" class="title" font-size="26">SQLite + FTS5 + graph</text>
    <text x="580" y="714" class="copy">Exact, lexical, metadata,</text>
    <text x="580" y="739" class="copy">and relationship recall</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="972" y="595" width="352" height="151" rx="20" fill="#10213a" stroke="#31547d" stroke-width="2"/>
    <text x="1008" y="637" class="eyebrow">OPTIONAL LOCAL SIGNAL</text>
    <text x="1008" y="681" class="title" font-size="26">Semantic retrieval</text>
    <text x="1008" y="714" class="copy">Multilingual embeddings</text>
    <text x="1008" y="739" class="copy">with safe degradation</text>
  </g>

  <path d="M292 750v35h428M720 750v35M1148 750v35H720" fill="none" stroke="#5eead4" stroke-width="3"/>
  <path d="M720 785v29" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="445" y="819" width="550" height="63" rx="18" fill="url(#context)"/>
    <text x="720" y="858" text-anchor="middle" class="title" font-size="27">ContextPack → agent context</text>
  </g>
</svg>
