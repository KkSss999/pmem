name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: 1.4.4

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  pack:
    name: Pack and install
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Pack, inspect, and install the unified package
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/pmem-packages"
          INSTALL_DIR="$RUNNER_TEMP/pmem-install"
          mkdir -p "$PACK_DIR" "$INSTALL_DIR"

          TARBALL="$(bun pm pack --quiet --destination "$PACK_DIR")"
          tar -tzf "$TARBALL" > contents.txt
          ! grep -qE '(^|/)src/|\.test\.|(^|/)temp/|(^|/)node_modules/' contents.txt \
            || { echo "FAIL: tarball contains source, test, temp, or node_modules files"; exit 1; }
          for required in dist/index.js dist/workers/semanticIndex.js dist/core/semantic/transformers.js README.md; do
            grep -qx "package/$required" contents.txt || { echo "FAIL: tarball missing $required"; exit 1; }
          done

          (cd "$INSTALL_DIR" && bun add "$TARBALL" >/dev/null)
          VERSION="$(node -p "require('./package.json').version")"
          "$INSTALL_DIR/node_modules/.bin/pmem" --version | grep -q "$VERSION"
          mkdir -p "$INSTALL_DIR/project" && cd "$INSTALL_DIR/project"
          "$INSTALL_DIR/node_modules/.bin/pmem" init smoke >/dev/null
          test -f .pmem/pmem.db

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, pack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check registry versions
        id: version-check
        run: |
          set -euo pipefail
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          registry_state="$(node scripts/npm-release-state.js pmem-ai "$ROOT_VERSION")"
          echo "root_state=$registry_state" >> "$GITHUB_OUTPUT"
          case "$registry_state" in
            public)
              echo "root_changed=false" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION is publicly available"
              ;;
            accepted_pending)
              echo "root_changed=false" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION was accepted by npm and is awaiting public replication"
              ;;
            missing)
              echo "root_changed=true" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION is not published yet"
              ;;
            *)
              echo "Unknown registry state for pmem-ai@$ROOT_VERSION: $registry_state" >&2
              exit 2
              ;;
          esac
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Configure registry auth
        if: steps.version-check.outputs.root_changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      - name: Verify registry auth
        if: steps.version-check.outputs.root_changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ACCOUNT="$(curl -fsS -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/whoami | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).username')"
          echo "npm token authenticates as $ACCOUNT"
      - name: Publish root package
        if: steps.version-check.outputs.root_changed == 'true'
        run: bun publish --access public
      - name: Confirm root package is visible in registry
        env:
          NPM_VISIBILITY_ATTEMPTS: 90
          NPM_VISIBILITY_INTERVAL_SECONDS: 10
        run: bash scripts/wait-for-npm-package.sh pmem-ai "${{ steps.version-check.outputs.version }}"
      - name: Check GitHub release
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version-check.outputs.version }}"
          RESPONSE_FILE="$(mktemp)"
          set +e
          HTTP_STATUS="$(curl \
            --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "GitHub release lookup failed with curl status $CURL_STATUS" >&2
            exit "$CURL_STATUS"
          fi
          case "$HTTP_STATUS" in
            200) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "GitHub release $TAG already exists" ;;
            404) echo "changed=true" >> "$GITHUB_OUTPUT"; echo "GitHub release $TAG is missing and will be created" ;;
            *) echo "GitHub release lookup returned HTTP $HTTP_STATUS" >&2; cat "$RESPONSE_FILE" >&2; exit 1 ;;
          esac
      - name: Create GitHub Release
        if: steps.release-check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.version }}
          name: pmem v${{ steps.version-check.outputs.version }}
          body: |
            Release of pmem v${{ steps.version-check.outputs.version }}.
            
            Please see CHANGELOG.md for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
