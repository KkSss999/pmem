name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e:install
      - run: npm run test:e2e:workflow
      - run: npm run test:e2e:non-git
      - run: npm run test:e2e:v07-novel
      - run: npm run test:e2e:v07-research
      - run: npm run test:e2e:v07-sync-flow
      - run: npm run test:e2e:v074-agent-ux
      - run: npm run test:e2e:v075-context-restoration
      - run: npm run test:e2e:v075-next-dedup

  pack:
    name: Pack and audit release package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:release-registry
      - run: npm run test:e2e:semantic-runtime
      - name: Audit production dependencies
        run: |
          npm audit --registry=https://registry.npmjs.org/ --omit=dev --audit-level=high
      - name: Pack and install the unified package
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/pmem-packages"
          ROOT_INSTALL_DIR="$RUNNER_TEMP/pmem-root-install"
          mkdir -p "$PACK_DIR" "$ROOT_INSTALL_DIR"

          npm pack --dry-run
          ROOT_TARBALL="$PACK_DIR/$(npm pack --silent --pack-destination "$PACK_DIR")"

          tar -tzf "$ROOT_TARBALL" > root-tarball-contents.txt
          ! grep -qE '(^|/)src/' root-tarball-contents.txt || { echo "FAIL: root tarball contains src/"; exit 1; }
          ! grep -q '\.test\.' root-tarball-contents.txt || { echo "FAIL: root tarball contains test files"; exit 1; }
          ! grep -qE '(^|/)temp/' root-tarball-contents.txt || { echo "FAIL: root tarball contains temp/"; exit 1; }
          ! grep -qE '(^|/)node_modules/' root-tarball-contents.txt || { echo "FAIL: root tarball contains node_modules/"; exit 1; }
          grep -q 'dist/index\.js' root-tarball-contents.txt || { echo "FAIL: root tarball missing dist/index.js"; exit 1; }
          grep -q 'dist/core/semantic/transformers\.js' root-tarball-contents.txt || { echo "FAIL: root tarball missing bundled semantic runtime"; exit 1; }
          grep -q 'README\.md' root-tarball-contents.txt || { echo "FAIL: root tarball missing README.md"; exit 1; }

          npm install --prefix "$ROOT_INSTALL_DIR" "$ROOT_TARBALL"
          ROOT_INSTALL_DIR="$ROOT_INSTALL_DIR" node <<'NODE'
          const { createRequire } = require('node:module');
          const path = require('node:path');
          const requireFromInstall = createRequire(path.join(process.env.ROOT_INSTALL_DIR, 'package.json'));
          const packageRoot = path.dirname(requireFromInstall.resolve('pmem-ai/package.json'));
          requireFromInstall.resolve('@huggingface/transformers');
          const runtime = require(path.join(packageRoot, 'dist/core/semantic/transformers.js'));
          if (typeof runtime.createOfflineTransformersProvider !== 'function') {
            throw new Error('Installed pmem-ai package is missing the semantic provider');
          }
          (async () => {
            await runtime.assertTransformersRuntimeAvailable();
            console.log('Installed pmem-ai package resolves its bundled Transformers runtime.');
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, e2e, pack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Check registry versions
        id: version-check
        run: |
          set -euo pipefail
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          registry_state="$(node scripts/npm-release-state.js pmem-ai "$ROOT_VERSION")"
          echo "root_state=$registry_state" >> "$GITHUB_OUTPUT"
          case "$registry_state" in
            public)
              echo "root_changed=false" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION is publicly available"
              ;;
            accepted_pending)
              echo "root_changed=false" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION was accepted by npm and is awaiting public replication"
              ;;
            missing)
              echo "root_changed=true" >> "$GITHUB_OUTPUT"
              echo "pmem-ai@$ROOT_VERSION is not published yet"
              ;;
            *)
              echo "Unknown registry state for pmem-ai@$ROOT_VERSION: $registry_state" >&2
              exit 2
              ;;
          esac
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish root package
        if: steps.version-check.outputs.root_changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Confirm root package is visible in registry
        env:
          NPM_VISIBILITY_ATTEMPTS: 90
          NPM_VISIBILITY_INTERVAL_SECONDS: 10
        run: |
          bash scripts/wait-for-npm-package.sh \
            pmem-ai \
            "${{ steps.version-check.outputs.version }}"
      - name: Check GitHub release
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version-check.outputs.version }}"
          RESPONSE_FILE="$(mktemp)"
          set +e
          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "GitHub release lookup failed with curl status $CURL_STATUS" >&2
            exit "$CURL_STATUS"
          fi
          case "$HTTP_STATUS" in
            200)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "GitHub release $TAG already exists"
              ;;
            404)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "GitHub release $TAG is missing and will be created"
              ;;
            *)
              echo "GitHub release lookup returned HTTP $HTTP_STATUS" >&2
              cat "$RESPONSE_FILE" >&2
              exit 1
              ;;
          esac
      - name: Create GitHub Release
        if: steps.release-check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.version }}
          name: pmem v${{ steps.version-check.outputs.version }}
          body: |
            Release of pmem v${{ steps.version-check.outputs.version }}.
            
            Please see CHANGELOG.md for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
